services:
  postgres:
    image: postgres:16
    container_name: performance-coach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: performance
      POSTGRES_PASSWORD: performance
      POSTGRES_DB: performance_coach
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U performance -d performance_coach"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
