# Verification gate for AGENTS.md §17 (Verification Rules): the checks that
# section already requires, run on every PR instead of only on the machine of
# whoever remembered.
#
# The api job runs the integration tests against a real PostgreSQL, not just
# `go build`. That is deliberate and load-bearing: every *_integration_test.go
# in this repo calls requireDB(t), which calls t.Skip() when TEST_DATABASE_URL
# is unset — and a fully skipped package still reports `ok`. Without a
# database, `go test ./...` is green while running close to nothing (19 skips,
# 0 passes in internal/scheduledworkout alone). The "no tests were skipped"
# step below exists so that failure mode can never come back silently.
name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

# A new push to the same PR/branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (go)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to the same major as docker-compose.yml, so CI and local
        # development do not disagree about server behavior.
        image: postgres:16
        env:
          POSTGRES_USER: performance
          POSTGRES_PASSWORD: performance
          POSTGRES_DB: performance_coach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U performance -d performance_coach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The test harness asserts this URL targets performance_coach_test, so a
      # misconfigured CI can never point the suite at a real database.
      #
      # DATABASE_URL is deliberately NOT set here. Several suites (athlete,
      # coachsignup, exercise, invitecode) skip themselves when DATABASE_URL
      # resolves to the same database as TEST_DATABASE_URL, so that
      # destructive tests can never run against a development or production
      # database. Setting both job-wide tripped exactly that guard and
      # silently skipped 29 tests. It is scoped to the migrate step instead.
      TEST_DATABASE_URL: postgres://performance:performance@localhost:5432/performance_coach_test?sslmode=disable

    defaults:
      run:
        working-directory: apps/api
        # Actions' default Linux shell is `bash -e`, which does NOT set
        # pipefail: `go test ... | tee` would then exit with tee's status and
        # a failing suite would report success. `shell: bash` is Actions'
        # spelling of `bash --noprofile --norc -eo pipefail`.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read from go.mod rather than pinned here, so the toolchain cannot
          # drift away from what the module declares.
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Apply migrations
        # The same entrypoint used in deployment, not a test-only schema path,
        # so a migration that cannot apply from empty fails here first.
        # DATABASE_URL is set only here — see the env block above.
        env:
          DATABASE_URL: postgres://performance:performance@localhost:5432/performance_coach_test?sslmode=disable
        run: go run ./cmd/migrate

      - name: go test
        # -p 1: the integration suites share one database and are not safe to
        # run in parallel across packages.
        run: go test -count=1 -p 1 -v ./... 2>&1 | tee test-output.log

      - name: Assert no tests were skipped
        # See the header comment. If TEST_DATABASE_URL ever stops reaching the
        # service container, the step above still passes — this one does not.
        run: |
          skipped=$(grep -c '^--- SKIP' test-output.log || true)
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped test(s) skipped — the integration suite is not actually running."
            grep '^--- SKIP' test-output.log
            exit 1
          fi
          echo "No skipped tests."

  web:
    name: web (next)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Must precede the typecheck: `next build` generates .next/types,
        # which is where Next 16 puts the global route types app/layout.tsx
        # relies on (LayoutProps). Running tsc first fails with
        # "Cannot find name 'LayoutProps'" — invisible locally, because a
        # developer's .next already exists from a previous run.
        #
        # No NEXT_PUBLIC_FIREBASE_* values are provided on purpose: the build
        # must not depend on runtime configuration, and this proves it stays
        # that way. Firebase config is read in the browser, and AuthProvider
        # already fails closed when it is absent.
        run: npm run build

      - name: Typecheck
        # `next build` type-checks too, but running tsc on its own reports
        # every error rather than stopping at the first, which is what makes a
        # red build actionable.
        run: npx tsc --noEmit

  deploy-api-staging:
    name: deploy api (staging)
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    # OIDC is granted only to this staging deploy job. Pull requests cannot
    # reach the job because of the condition above, and the GCP provider also
    # independently restricts tokens to this repository's staging ref.
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: dontworkout
      GCP_REGION: asia-southeast1
      GAR_HOST: asia-east1-docker.pkg.dev
      IMAGE_URI: asia-east1-docker.pkg.dev/dontworkout/performance-coach/api
      SERVICE_NAME: performance-coach-api-staging

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          # The migration guard compares the complete push range, not just the
          # final commit. A shallow checkout could silently miss an earlier
          # migration in a multi-commit push.
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: dontworkout
          workload_identity_provider: projects/33959430194/locations/global/workloadIdentityPools/github-actions/providers/performance-coach
          service_account: pc-github-staging-deploy@dontworkout.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Refuse automatic schema changes
        env:
          # The first staging revision predates CI labels. Its source SHA is
          # recorded in docs/deployment-checkpoint.md; every revision created
          # by this workflow carries its own commit-sha label afterward.
          INITIAL_DEPLOYED_SHA: 1bff00b0bd9d07f955f16d75fe481990c39b0133
        run: |
          service_json=$(gcloud run services describe "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json)
          serving_revision=$(jq -r \
            'first(.status.traffic[] | select((.percent // 0) == 100) | .revisionName) // empty' \
            <<< "$service_json")

          if [ -z "$serving_revision" ]; then
            echo "::error::Cannot identify the revision currently serving 100% of staging traffic."
            exit 1
          fi

          revision_json=$(gcloud run revisions describe "$serving_revision" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json)
          deployed_sha=$(jq -r '.metadata.labels["commit-sha"] // empty' <<< "$revision_json")

          if [ -z "$deployed_sha" ]; then
            deployed_sha="$INITIAL_DEPLOYED_SHA"
            echo "Using the recorded source SHA for the pre-CI staging revision."
          fi

          if [[ ! "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The serving revision does not contain a valid source SHA."
            exit 1
          fi
          if ! git cat-file -e "$deployed_sha^{commit}"; then
            echo "::error::The deployed source SHA is not present in repository history."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$deployed_sha" "$GITHUB_SHA"; then
            echo "::error::The deployed source SHA is not an ancestor of this staging commit."
            exit 1
          fi

          migration_files=$(git diff --name-only "$deployed_sha" "$GITHUB_SHA" -- apps/api/migrations)
          if [ -n "$migration_files" ]; then
            echo "::error::Staging migrations are not automated yet; refusing to deploy an API that may require a newer schema."
            echo "$migration_files"
            exit 1
          fi

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "$GAR_HOST" --quiet

      - name: Build and push API image
        run: |
          docker build --file apps/api/Dockerfile --tag "$IMAGE_URI:$GITHUB_SHA" .
          docker push "$IMAGE_URI:$GITHUB_SHA"

      - name: Resolve immutable image digest
        id: image
        run: |
          digest=$(gcloud artifacts docker images describe "$IMAGE_URI:$GITHUB_SHA" \
            --project="$GCP_PROJECT_ID" \
            --format='value(image_summary.digest)')

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Artifact Registry returned an invalid image digest."
            exit 1
          fi

          echo "image=$IMAGE_URI@$digest" >> "$GITHUB_OUTPUT"
          echo "Deploying immutable image $IMAGE_URI@$digest"

      - name: Name candidate tag
        id: candidate-name
        run: echo "tag=candidate-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Deploy candidate revision without traffic
        env:
          CANDIDATE_TAG: ${{ steps.candidate-name.outputs.tag }}
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="${{ steps.image.outputs.image }}" \
            --no-traffic \
            --tag="$CANDIDATE_TAG" \
            --update-labels="managed-by=github-actions,commit-sha=$GITHUB_SHA" \
            --quiet

      - name: Resolve candidate URL
        id: candidate
        env:
          CANDIDATE_TAG: ${{ steps.candidate-name.outputs.tag }}
        run: |
          service_json=$(gcloud run services describe "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json)
          candidate_url=$(jq -r --arg tag "$CANDIDATE_TAG" \
            'first(.status.traffic[] | select(.tag == $tag) | .url) // empty' <<< "$service_json")
          candidate_revision=$(jq -r --arg tag "$CANDIDATE_TAG" \
            'first(.status.traffic[] | select(.tag == $tag) | .revisionName) // empty' <<< "$service_json")

          if [ -z "$candidate_url" ] || [ -z "$candidate_revision" ]; then
            echo "::error::Cloud Run did not return a URL and revision for the candidate tag."
            exit 1
          fi

          echo "url=$candidate_url" >> "$GITHUB_OUTPUT"
          echo "revision=$candidate_revision" >> "$GITHUB_OUTPUT"

      - name: Smoke-test candidate
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        run: |
          for attempt in {1..12}; do
            health_ok=false
            ready_ok=false

            if curl --fail --silent --show-error "$CANDIDATE_URL/health" >/dev/null; then
              health_ok=true
            fi
            if curl --fail --silent --show-error "$CANDIDATE_URL/ready" >/dev/null; then
              ready_ok=true
            fi

            if [ "$health_ok" = true ] && [ "$ready_ok" = true ]; then
              echo "Candidate passed /health and /ready."
              exit 0
            fi

            echo "Candidate not ready (attempt $attempt/12)."
            sleep 5
          done

          echo "::error::Candidate failed staging smoke tests; existing traffic was not changed."
          exit 1

      - name: Promote candidate to staging traffic
        env:
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          gcloud run services update-traffic "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --to-revisions="$CANDIDATE_REVISION=100" \
            --quiet

      - name: Verify serving URL
        run: |
          service_url=$(gcloud run services describe "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.url)')

          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$service_url/health" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$service_url/ready" >/dev/null
          echo "Staging API is healthy at $service_url"

      - name: Remove successful candidate tag
        env:
          CANDIDATE_TAG: ${{ steps.candidate-name.outputs.tag }}
        run: |
          gcloud run services update-traffic "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --remove-tags="$CANDIDATE_TAG" \
            --quiet
